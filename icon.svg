<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#000000"/>
      <stop offset="100%" stop-color="#120c24"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="50%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#8b5cf6" flood-opacity="0.5"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="rgba(139,92,246,0.4)" stroke-width="6"/>
  <!-- Candlestick graphic -->
  <g filter="url(#shadow)" transform="translate(64, 64)">
    <line x1="80" y1="90" x2="80" y2="290" stroke="#10b981" stroke-width="8" stroke-linecap="round"/>
    <rect x="55" y="140" width="50" height="100" rx="8" fill="#10b981"/>
    
    <line x1="190" y1="60" x2="190" y2="320" stroke="url(#glow)" stroke-width="10" stroke-linecap="round"/>
    <rect x="160" y="110" width="60" height="150" rx="10" fill="url(#glow)"/>
    
    <line x1="300" y1="120" x2="300" y2="300" stroke="#f43f5e" stroke-width="8" stroke-linecap="round"/>
    <rect x="275" y="160" width="50" height="80" rx="8" fill="#f43f5e"/>
  </g>
</svg>