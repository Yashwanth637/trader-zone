    <script>
      // Immediate theme initialization to prevent flash
      (function() {
        var savedTheme = localStorage.getItem('tz_theme');
        if (savedTheme === 'light') {
          document.documentElement.classList.remove('dark');
          document.documentElement.classList.add('light');
        } else {
          document.documentElement.classList.remove('light');
          document.documentElement.classList.add('dark');
        }

    <script>
      // In development (localhost), unregister service workers to avoid stale Vite module caching
      if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function(registrations) {
            for (let registration of registrations) {
              registration.unregister();
            }
          });
          if ('caches' in window) {
            caches.keys().then(function(names) {
              for (let name of names) caches.delete(name);
            });
          }
        }
      } else if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/sw.js').then(function(reg) {
            console.log('Trader Zone ServiceWorker registered:', reg.scope);
          }).catch(function(err) {
            console.log('Trader Zone ServiceWorker registration failed:', err);
          });
        });
      }
    </script>
